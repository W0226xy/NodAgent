server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve the Docker service name at request time. Without a variable,
        # Nginx resolves `backend` only at startup and keeps the old container
        # IP after a backend rebuild/recreate, which produces 502 responses.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
